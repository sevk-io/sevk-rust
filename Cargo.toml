[package]
name = "sevk"
version = "1.0.0"
edition = "2021"
description = "Rust SDK for Sevk API"
authors = ["Sevk <dev@sevk.io>"]
license = "MIT"
repository = "https://github.com/sevk-io/sevk-rust"
homepage = "https://sevk.io"
documentation = "https://docs.rs/sevk"
readme = "README.md"
exclude = ["test_email.rs", "examples/", "tests/"]
keywords = ["sevk", "email", "api", "sdk"]
categories = ["api-bindings", "email"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
quick-xml = "0.37"
regex = "1.11"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }

[dev-dependencies]
tokio-test = "0.4"
rand = "0.8"
dotenv = "0.15"

[lib]
name = "sevk"
path = "src/lib.rs"
