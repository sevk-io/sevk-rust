[package]
name = "sevk"
version = "1.1.0"
edition = "2021"
rust-version = "1.79"
description = "Rust SDK for Sevk API"
authors = ["Sevk <dev@sevk.io>"]
license = "MIT"
repository = "https://github.com/sevk-io/sevk-rust"
homepage = "https://sevk.io"
documentation = "https://docs.rs/sevk"
readme = "README.md"
exclude = ["examples/", "tests/"]
keywords = ["sevk", "email", "api", "sdk"]
categories = ["api-bindings", "email"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.9"
syntect = { version = "5.1", default-features = false, features = ["default-syntaxes", "html", "regex-fancy"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2.5"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
rand = "0.8"

[lib]
name = "sevk"
path = "src/lib.rs"
